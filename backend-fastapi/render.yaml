# Render Blueprint — FynkTech AI connector (FastAPI)
#
# Mirrors ../../Fynktech-oms/render.yaml's pattern for the Django service.
# Root Directory = backend-fastapi if this blueprint is added from a repo
# whose root is fynk-tech-ai/ (adjust rootDir, or drop it, to match wherever
# this file actually ends up relative to the connected repo's root).
services:
  - type: web
    name: fynktech-ai-connector
    runtime: python
    rootDir: backend-fastapi
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://app.fynktech.com
      - key: SHOPIFY_APP_URL
        value: https://fynk-tech-ai.vercel.app
