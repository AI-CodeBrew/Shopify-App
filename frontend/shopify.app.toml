# FynkTech AI - OMS connector for Shopify
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
#
# This app exists to do one job: on install, capture the store's Admin API
# credentials and hand them to the FynkTech OMS so the merchant only has to
# press "Connect" once. See README-OMS.md.

client_id = "7590f0304311e258480108f37b900604"
name = "FynkTech AI"
handle = "fynktech-ai"
application_url = "https://REPLACE-ME.example.com"
embedded = true

[access_scopes]
# Managed installation: this list is the source of truth once deployed with
# include_config_on_deploy. Keep SCOPES in .env identical for local dev.
#
# Grouped by the OMS module that consumes it. Anything marked PROTECTED needs
# an explicit approval request in the Partner Dashboard before the App Store
# listing can go live - see README-OMS.md "Protected scopes".
scopes = """
read_orders,
write_orders,
read_all_orders,
read_draft_orders,
write_draft_orders,
read_order_edits,
write_order_edits,
read_fulfillments,
write_fulfillments,
read_assigned_fulfillment_orders,
write_assigned_fulfillment_orders,
read_merchant_managed_fulfillment_orders,
write_merchant_managed_fulfillment_orders,
read_third_party_fulfillment_orders,
write_third_party_fulfillment_orders,
read_inventory,
write_inventory,
read_locations,
read_returns,
write_returns,
read_products,
write_products,
read_customers,
write_customers,
read_shipping,
write_shipping,
read_price_rules,
read_discounts,
read_shopify_payments_payouts,
read_shopify_payments_disputes
"""

# Merchant-facing declaration so the OAuth grant screen explains *why* each
# family of data is requested rather than showing a wall of 30 permissions.
optional_scopes = [ ]

[auth]
redirect_urls = [
  "https://REPLACE-ME.example.com/auth/callback",
  "https://REPLACE-ME.example.com/auth/shopify/callback",
  "https://REPLACE-ME.example.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  # Lifecycle: keeps the OMS-side credential row honest.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory for App Store distribution. Shopify rejects the listing without
  # all three, and it verifies them during review.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
